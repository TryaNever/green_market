services:
  frontend:
    image: tryanever/green_market-frontend:latest
    container_name: green_market_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: php
    expose:
      - "9000"
    volumes:
      - ./backend:/var/www/html
      - symfony_var:/var/www/html/var

  backend_nginx:
    image: nginx:alpine
    container_name: backend_nginx
    ports:
      - "9000:80"
    depends_on:
      - php
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: mysql:8.0
    container_name: symfony_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db

volumes:
  db_data:
  symfony_var:
